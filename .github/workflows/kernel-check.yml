name: Kernel Check

on:
  pull_request:
  push:
    branches:
      - main
      - build/creative-knowledge-engine-v1

permissions:
  contents: read

jobs:
  validate-kernel:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install

      - name: Type-check runtime
        run: bun run typecheck

      - name: Run runtime tests
        run: bun test

      - name: Assemble ChatGPT fixture
        run: bun run assemble -- tests/fixtures/scene-revision.task.yaml chatgpt

      - name: Assemble Claude fixture
        run: bun run assemble -- tests/fixtures/scene-revision.task.yaml claude

      - name: Verify natural-language intake
        run: bun run intake -- chatgpt "Rewrite EKPO's shrine scene under the covenant mythology"
